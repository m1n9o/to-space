id: prj_axiom-space-private-missions
slug: axiom-space-private-missions
name: 国际空间站私人宇航员任务（Ax 系列）
operatorName: Axiom Space（SpaceX Crew Dragon 运输）
countryOrRegion: 美国
description: Axiom 组织私人乘员搭乘 SpaceX Crew Dragon 前往国际空间站，任务须经 NASA 批准。已完成 Ax-1 至 Ax-4 四次任务。客户以国家航天机构和科研机构为主，采用询价制。
missionType: SPACE_STATION_MISSION
participationPathways: [PURCHASE]
experienceDescription: 在国际空间站停靠最多约 14 天，乘员需完成数百小时的系统训练。
targetCustomerSegments:
  [
    GOVERNMENT_OR_NATIONAL_AGENCY,
    RESEARCH_INSTITUTION,
    HIGH_NET_WORTH_INDIVIDUAL,
    CORPORATE_OR_BRAND,
  ]
developmentStage: COMMERCIAL_OPERATIONS
commercialAvailability: CONTACT_SALES
classificationVerifiedAt: '2026-10-19'
classificationSourceIds: [src_nasa-pam, src_axiom-human-spaceflight]
officialWebsiteUrl: https://www.axiomspace.com/
officialContactUrl: https://www.axiomspace.com/human-spaceflight
firstPublishedAt: '2026-09-16'

