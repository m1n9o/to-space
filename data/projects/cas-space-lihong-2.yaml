description: 力鸿二号是可重复使用的亚轨道运载器，设计可载 7 人或 3 吨货物。无人验证器力鸿一号已完成 120 km 亚轨道飞行。力鸿二号首飞计划为载货版，载人旅游仍处于远期规划。
missionType: SUBORBITAL
participationPathways: [PURCHASE]
experienceDescription: 设计目标：高度不低于 100 km，微重力时间不少于 180 秒。
