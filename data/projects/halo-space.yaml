id: prj_halo-space
slug: halo-space
name: 平流层气球舱飞行
operatorName: HALO Space
countryOrRegion: 西班牙
description: 平流层气球加乘员舱，目标高度约 35 km。不进入太空，也没有失重体验。目前只完成无人原型测试，尚未开放预订。
missionType: NEAR_SPACE
participationPathways: [PURCHASE]
experienceDescription: 乘员舱可容纳 1 名驾驶员和 8 名乘客；飞行 4–6 小时；含 7 天地面行程。首个运营基地在沙特阿拉伯，之后计划扩展到澳大利亚、西班牙和美国。
targetCustomerSegments: [HIGH_NET_WORTH_INDIVIDUAL]
developmentStage: TESTING
commercialAvailability: WAITLIST_OR_INTEREST
classificationVerifiedAt: '2026-10-19'
classificationSourceIds: [src_halo-home, src_halo-faq]
officialWebsiteUrl: https://www.halospaceflight.com/
officialContactUrl: https://www.halospaceflight.com/contact-form
firstPublishedAt: '2026-09-16'

