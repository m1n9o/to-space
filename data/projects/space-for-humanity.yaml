name: 公民宇航员计划
operatorName: Space for Humanity（非营利组织）
countryOrRegion: 美国
description: 非营利组织 Space for Humanity 选拔"公民宇航员"并全额赞助其飞行，不绑定特定飞行器，历史上使用的是 Blue Origin New Shepard。申请已于 2022 年关闭，目前没有公开的飞行计划。
missionType: SUBORBITAL
participationPathways: [SPONSORSHIP, APPLICATION_SELECTION]
experienceDescription: 一年期计划，包括飞前训练、飞行和飞行后的领导力发展计划。选拔分三轮，由委员会评审。
