id: prj_vast-private-astronaut-missions
slug: vast-private-astronaut-missions
name: 私人宇航员任务（ISS / Haven-1）
operatorName: Vast（SpaceX Dragon 运输）
countryOrRegion: 美国
description: Vast 提供两条路径。一是 NASA 第六次国际空间站私人宇航员任务（Vast-PAM-1）；二是自建的商业空间站 Haven-1，计划 2027 年发射。Haven-1 站体尚未发射，载人任务尚未验证。
missionType: SPACE_STATION_MISSION
participationPathways: [PURCHASE]
experienceDescription: Haven-1 运行在 425 km、51.6° 倾角轨道，可容纳 4 名乘员执行两周任务。ISS 任务最多停靠约 14 天。
targetCustomerSegments:
  [
    GOVERNMENT_OR_NATIONAL_AGENCY,
    RESEARCH_INSTITUTION,
    HIGH_NET_WORTH_INDIVIDUAL,
  ]
developmentStage: PREPARING_FIRST_CREWED_FLIGHT
commercialAvailability: CONTACT_SALES
classificationVerifiedAt: '2026-10-19'
classificationSourceIds: [src_vast-haven-1, src_vast-pam, src_nasa-pam6]
officialWebsiteUrl: https://www.vastspace.com/
